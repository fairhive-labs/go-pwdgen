<!-- index.html — PWDGEN // SECURE FORGE -->
<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
    <meta charset="utf-8">
    <title>PoLN · PWDGEN // SECURE FORGE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.className = "js";</script>
    <style>
        :root {
            --bg: #060a0f;
            --panel: rgba(12, 28, 20, .35);
            --edge: #12351f;
            --green: #3bf07a;
            --green-bright: #8dffb6;
            --green-dim: #1c8a4c;
            --magenta: #ff5cf4;
            --dim: #4a6b57;
            --mono: "JetBrains Mono", "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(1200px 700px at 50% -10%, #0c1a16 0%, transparent 60%),
                radial-gradient(900px 600px at 110% 120%, #150b1e 0%, transparent 55%),
                var(--bg);
            color: var(--green);
            font-family: var(--mono);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            min-height: 100vh;
            letter-spacing: .04em;
        }

        /* CRT scanlines + vignette overlay */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px),
                radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0, 0, 0, .55) 100%);
            mix-blend-mode: multiply;
            z-index: 9;
        }

        .terminal {
            width: min(680px, 100%);
            background: var(--panel);
            border: 1px solid var(--edge);
            border-radius: 10px;
            box-shadow:
                0 0 0 1px rgba(59, 240, 122, .05),
                0 30px 80px -20px rgba(0, 0, 0, .8),
                0 0 120px -40px rgba(59, 240, 122, .25);
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: linear-gradient(180deg, rgba(59, 240, 122, .08), transparent);
            border-bottom: 1px solid var(--edge);
        }

        .dots {
            display: flex;
            gap: 7px;
        }

        .dots i {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #223;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
        }

        .dots i:nth-child(1) { background: #ff5f57; }
        .dots i:nth-child(2) { background: #febc2e; }
        .dots i:nth-child(3) { background: #28c840; }

        .bar-title {
            font-size: 12px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: .18em;
        }

        .screen {
            padding: 26px clamp(16px, 5vw, 34px) 30px;
            font-size: clamp(13px, 2.6vw, 15px);
            line-height: 1.6;
            text-shadow: 0 0 8px rgba(59, 240, 122, .35);
        }

        .banner {
            border: 2px double var(--green-dim);
            border-radius: 4px;
            padding: 14px 10px;
            text-align: center;
            margin-bottom: 22px;
            background: rgba(59, 240, 122, .04);
        }

        .banner-title {
            color: var(--green-bright);
            font-weight: 700;
            letter-spacing: .5em;
            font-size: 1.15em;
        }

        .banner-sub {
            color: var(--green);
            letter-spacing: .3em;
            font-size: .9em;
            margin-top: 4px;
            opacity: .85;
        }

        .tasks {
            list-style: none;
            margin: 0 0 14px;
            padding: 0;
        }

        .tasks li {
            display: flex;
            align-items: baseline;
            gap: .6ch;
            opacity: 0;
        }

        .js .tasks li { opacity: 0; }
        .no-js .tasks { display: none; }

        .tasks li.show { opacity: 1; }

        .tasks .lbl { white-space: nowrap; }
        .tasks .lbl::before { content: "> "; color: var(--green-dim); }

        .tasks .lead {
            flex: 1;
            border-bottom: 1px dotted var(--green-dim);
            transform: translateY(-4px);
            opacity: .5;
        }

        .tasks .ok {
            color: var(--green-bright);
            font-weight: 700;
            opacity: 0;
        }

        .tasks li.show .ok { opacity: 1; }

        .progress {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: var(--green-bright);
        }

        .track {
            flex: 1;
            height: 14px;
            border: 1px solid var(--green-dim);
            border-radius: 2px;
            background:
                repeating-linear-gradient(90deg, rgba(59, 240, 122, .08) 0 6px, transparent 6px 8px);
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--green-dim), var(--green-bright));
            box-shadow: 0 0 14px rgba(59, 240, 122, .6);
        }

        .js .fill { width: 0; }

        .pct {
            min-width: 4ch;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .payload-label {
            color: var(--green);
        }

        .payload-value {
            margin: 6px 0 2px;
            padding-left: 2.5ch;
        }

        .pwd {
            color: var(--magenta);
            font-weight: 700;
            font-size: 1.15em;
            word-break: break-all;
            text-shadow: 0 0 10px rgba(255, 92, 244, .55), 0 0 26px rgba(255, 92, 244, .3);
        }

        .js .payload-value { opacity: 0; }
        .payload-value.show { opacity: 1; }

        .tagline {
            margin-top: 16px;
            color: var(--green-dim);
            font-size: .85em;
            letter-spacing: .12em;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px solid var(--edge);
        }

        .ctl-len {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1 1 220px;
            color: var(--dim);
            font-size: 12px;
            letter-spacing: .15em;
        }

        #len-out {
            color: var(--green-bright);
            min-width: 3ch;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 3px;
            background: var(--green-dim);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 18px;
            border-radius: 2px;
            background: var(--green-bright);
            box-shadow: 0 0 10px rgba(59, 240, 122, .8);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 18px;
            border: none;
            border-radius: 2px;
            background: var(--green-bright);
            box-shadow: 0 0 10px rgba(59, 240, 122, .8);
            cursor: pointer;
        }

        button {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--green-bright);
            background: rgba(59, 240, 122, .06);
            border: 1px solid var(--green-dim);
            border-radius: 3px;
            padding: 9px 14px;
            cursor: pointer;
            transition: background .15s, box-shadow .15s, color .15s, border-color .15s;
        }

        button:hover {
            background: rgba(59, 240, 122, .16);
            box-shadow: 0 0 18px -2px rgba(59, 240, 122, .6);
        }

        button:active { transform: translateY(1px); }

        #copy.copied {
            color: var(--magenta);
            border-color: var(--magenta);
            box-shadow: 0 0 18px -2px rgba(255, 92, 244, .7);
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--magenta);
            outline-offset: 2px;
        }

        .cursor::after {
            content: "▊";
            color: var(--green-bright);
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor::after { animation: none; }
            * { transition: none !important; }
        }
    </style>
</head>

<body>
    <main>
        <section class="terminal" aria-label="PWDGEN secure forge">
            <header class="bar">
                <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="bar-title">pwdgen.exe — secure forge</span>
            </header>
            <div class="screen">
                <div class="banner">
                    <div class="banner-title">— PWDGEN —</div>
                    <div class="banner-sub">SECURE FORGE ONLINE</div>
                </div>

                <ul class="tasks" aria-hidden="true">
                    <li data-label="SEEDING CSPRNG"><span class="lbl"></span><span class="lead"></span><span class="ok">[OK]</span></li>
                    <li data-label="REJECTION-SAMPLING ENTROPY"><span class="lbl"></span><span class="lead"></span><span class="ok">[OK]</span></li>
                    <li data-label="FORGING KEY"><span class="lbl"></span><span class="lead"></span><span class="ok">[OK]</span></li>
                </ul>

                <div class="progress" aria-hidden="true">
                    <span class="track"><span class="fill"></span></span>
                    <span class="pct">100%</span>
                </div>

                <div class="payload" data-length="{{.length}}">
                    <div class="payload-label">&gt;&gt;&gt; PAYLOAD [<span class="len">{{.length}}</span>]:</div>
                    <div class="payload-value cursor"><span class="pwd">{{.password}}</span></div>
                </div>

                <div class="tagline">// NO RIGHT PASSWORD, ONLY BETTER TOOLS</div>

                <div class="controls">
                    <label class="ctl-len">LEN
                        <input type="range" id="len-range" min="10" max="128" value="{{.length}}"
                            aria-label="password length">
                        <output id="len-out">{{.length}}</output>
                    </label>
                    <button id="reforge" type="button">▮ Re-forge</button>
                    <button id="copy" type="button">⧉ Copy</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            "use strict";
            var CHARSET = "^AZERTYUIOPMLKJHGFDSQWXCVBN_#@?1234567890-.!azertyuiopmlkjhgfdsqwxcvbn";
            var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            var screen = document.querySelector(".screen");
            var tasks = Array.prototype.slice.call(screen.querySelectorAll(".tasks li"));
            var fill = screen.querySelector(".fill");
            var pct = screen.querySelector(".pct");
            var payloadVal = screen.querySelector(".payload-value");
            var pwdEl = screen.querySelector(".pwd");
            var lenLabel = screen.querySelector(".payload .len");
            var range = document.getElementById("len-range");
            var lenOut = document.getElementById("len-out");
            var reforge = document.getElementById("reforge");
            var copyBtn = document.getElementById("copy");

            var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

            function labelFor(li, len) {
                var base = li.getAttribute("data-label");
                return base === "FORGING KEY" ? "FORGING " + len + "-CHAR KEY" : base;
            }

            function scramble(el, final) {
                return new Promise(function (resolve) {
                    if (REDUCED) { el.textContent = final; return resolve(); }
                    var dur = 480, start = performance.now();
                    (function frame(now) {
                        var p = Math.min(1, (now - start) / dur);
                        var locked = Math.floor(p * final.length), s = "";
                        for (var i = 0; i < final.length; i++) {
                            s += i < locked ? final[i] : CHARSET[(Math.random() * CHARSET.length) | 0];
                        }
                        el.textContent = s;
                        if (p < 1) requestAnimationFrame(frame);
                        else { el.textContent = final; resolve(); }
                    })(start);
                });
            }

            function fillBar(dur) {
                return new Promise(function (resolve) {
                    if (REDUCED) { fill.style.width = "100%"; pct.textContent = "100%"; return resolve(); }
                    var start = performance.now();
                    (function frame(now) {
                        var p = Math.min(1, (now - start) / dur);
                        fill.style.width = (p * 100) + "%";
                        pct.textContent = Math.round(p * 100) + "%";
                        if (p < 1) requestAnimationFrame(frame); else resolve();
                    })(start);
                });
            }

            async function play(pwd, len) {
                lenLabel.textContent = len;
                tasks.forEach(function (li) {
                    li.classList.remove("show");
                    li.querySelector(".lbl").textContent = labelFor(li, len);
                });
                payloadVal.classList.remove("show");
                fill.style.width = "0%";
                pct.textContent = "0%";

                for (var i = 0; i < tasks.length; i++) {
                    tasks[i].classList.add("show");
                    if (!REDUCED) await sleep(110);
                }
                await fillBar(560);
                payloadVal.classList.add("show");
                await scramble(pwdEl, pwd);
            }

            async function doForge() {
                var len = +range.value;
                reforge.disabled = true;
                try {
                    var res = await fetch("?l=" + len + "&mime=json", { headers: { "Accept": "application/json" } });
                    var data = await res.json();
                    await play(data.password, data.length);
                } catch (e) {
                    /* keep the current payload on failure */
                } finally {
                    reforge.disabled = false;
                }
            }

            async function copyPwd() {
                var text = pwdEl.textContent;
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {
                    var ta = document.createElement("textarea");
                    ta.value = text;
                    ta.style.position = "fixed";
                    ta.style.opacity = "0";
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand("copy"); } catch (_) { }
                    ta.remove();
                }
                var prev = copyBtn.textContent;
                copyBtn.textContent = "✓ Copied";
                copyBtn.classList.add("copied");
                setTimeout(function () {
                    copyBtn.textContent = prev;
                    copyBtn.classList.remove("copied");
                }, 1400);
            }

            range.addEventListener("input", function () { lenOut.textContent = range.value; });
            reforge.addEventListener("click", doForge);
            copyBtn.addEventListener("click", copyPwd);

            // Boot: replay the forge with the server-rendered credential.
            play(pwdEl.textContent, +document.querySelector(".payload").dataset.length);
        })();
    </script>
</body>

</html>
